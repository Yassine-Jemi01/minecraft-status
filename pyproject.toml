[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "minecraft-status"
version = "1.0.0"
description = "Cross-platform Minecraft Java Edition Discord Rich Presence"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GNU General Public License v3.0 or later" }
authors = [
  { name = "Yassine Jemi" }
]
keywords = ["minecraft", "discord", "rich-presence", "rpc"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
]
dependencies = [
  "cryptography>=42",
  "nbtlib>=2.0",
  "pypresence>=4.3",
]

[project.optional-dependencies]
keyring = ["keyring>=25"]
dev = [
  "pytest>=8",
  "keyring>=25",
]

[project.scripts]
minecraft-status = "minecraft_status.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
